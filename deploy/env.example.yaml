# Copy to deploy/env.yaml (gitignored) and fill in your own values.
# Non-secret Cloud Run environment variables — mirrors .env, minus
# FIREBASE_CREDENTIALS_PATH (that one points at the Secret Manager mount
# path in the container, not your local Mac path — see deploy.sh).
ANTHROPIC_MODEL: "claude-sonnet-5"
ALLOWED_EMAIL: "you@example.com"
GARMIN_MCP_COMMAND: "npx"
GARMIN_MCP_ARGS: "-y @nicolasvegam/garmin-connect-mcp"
TARGET_WKG: "4.5"
INTERVALS_ATHLETE_ID: "i000000"
FIREBASE_CREDENTIALS_PATH: "/secrets/firebase-credentials.json"
